server.port=8080

# Named events - each entry maps a stable ID and display name to two MapRun event IDs.
# Add further entries by incrementing the index (app.events[1], app.events[2], ...).
app.events[0].id=SUMM-2026
app.events[0].name=The SUMM, 2026
app.events[0].day1EventId=SUMM Day 1 v2 ScoreP420
app.events[0].day2EventId=SUMM Day 2 v2 ScoreP360
app.events[0].uniqueControls=false
app.events[0].teamsFilename=SUMM-2026.json

app.events[1].id=SUMM-2027
app.events[1].name=The SUMM, 2027
# TODO: update these
app.events[1].day1EventId=SUMM Day 1 ScoreP420
app.events[1].day2EventId=SUMM Day 2 ScoreP360
app.events[1].uniqueControls=true
app.events[1].teamsFilename=SUMM-2027.json

app.events[2].id=SUMM-2026-unique
app.events[2].name=The SUMM, 2026 (unique test)
app.events[2].day1EventId=SUMM Day 1 v2 ScoreP420
app.events[2].day2EventId=SUMM Day 2 v2 ScoreP360
app.events[2].uniqueControls=true
app.events[2].teamsFilename=SUMM-2026ut.json


# Path to store the teams JSON files
# Override with: app.teams-dir=/path/to/
app.teams-dir=/data/

# MapRun API response bodies are logged at INFO by MapRunApiClient.
# To suppress the raw JSON payloads without losing the other INFO lines,
# drop that class to WARN:
logging.level.com.maprun.results.client.MapRunApiClient=WARN
