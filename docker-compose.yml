services:

  summ-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8092:8080"
    environment:
      # ALLOWED_ORIGIN restricts CORS to the frontend origin.
      # Use "*" for development or set to your frontend URL in production.
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-*}
    restart: unless-stopped

  summ-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8093:80"
    environment:
      # API_BASE_URL is injected into index.html at container startup via envsubst.
      # Point this at the backend — use the Docker service name for internal networking,
      # or the public URL if the frontend is accessed from a browser outside Docker.
      API_BASE_URL: ${API_BASE_URL:-http://localhost:8092}
    depends_on:
      - summ-backend
    restart: unless-stopped
