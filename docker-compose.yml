services:

  summ-backend:
    image: summ-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8092:8080"
    environment:
      PORT: 8092

    restart: unless-stopped

  summ-frontend:
    image: summ-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # VUE_APP_* vars are baked into the static bundle at build time by Webpack.
      # They must be supplied here as build args, not just as runtime environment vars.
      args:
        VUE_APP_BACKEND_URL: ${VUE_APP_BACKEND_URL}
    ports:
      - "8093:80"
    depends_on:
      - summ-backend
    restart: unless-stopped
